plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Load local.properties for secrets (NEVER committed to git)
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

android {
    compileSdk 34
    namespace 'com.azluk.patcher'

    defaultConfig {
        applicationId "com.azluk.patcher"
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName "9.0"

        // ── TokenRouter config ────────────────────────────────────────────
        // Priority: local.properties  >  environment variable  >  empty
        //
        // local.properties (in project root, gitignored):
        //   TOKENROUTER_API_KEY=sk-tu-key-nueva
        //   TOKENROUTER_MODEL=anthropic/claude-3-5-sonnet
        //   TOKENROUTER_BASE_URL=https://api.tokenrouter.com/v1
        //
        // GitHub Actions: add TOKENROUTER_API_KEY as a repo secret;
        // the env var is picked up automatically by this build script.
        //
        // Empty key = AI diagnostics fall back to the offline expert
        // system (localDiagnosis) — the app still builds and works.
        def trKey = localProps.getProperty('TOKENROUTER_API_KEY', '')
                ?: System.getenv('TOKENROUTER_API_KEY') ?: ''
        def trModel = localProps.getProperty('TOKENROUTER_MODEL', '')
                ?: System.getenv('TOKENROUTER_MODEL') ?: 'anthropic/claude-3-5-sonnet'
        def trBase = localProps.getProperty('TOKENROUTER_BASE_URL', '')
                ?: System.getenv('TOKENROUTER_BASE_URL') ?: 'https://api.tokenrouter.com/v1'

        buildConfigField "String", "TOKENROUTER_API_KEY", "\"$trKey\""
        buildConfigField "String", "TOKENROUTER_MODEL", "\"$trModel\""
        buildConfigField "String", "TOKENROUTER_BASE_URL", "\"$trBase\""
    }

    buildTypes {
        debug { debuggable true; minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        compose true
        buildConfig true // needed for BuildConfig.TOKENROUTER_*
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    lint { abortOnError false }

    packaging {
        resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.navigation:navigation-compose:2.7.6'

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.android.tools.build:apksig:8.2.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.google.accompanist:accompanist-drawablepainter:0.32.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
